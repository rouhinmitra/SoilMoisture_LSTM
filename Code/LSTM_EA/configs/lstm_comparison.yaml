# Standard LSTM Configuration (for comparison with EA-LSTM)
# Uses the same features but standard LSTM architecture

name: "standard_lstm"

data:
  # Update these paths to match your data location
  train_files:
    - "ne1_1_maize.csv"
    - "ne2_1_maize.csv"
  test_files:
    - "ne3_1_maize.csv"
  data_dir: "/Users/rouhinmitra/SM_work/Data/Base/"
  seq_length: 30
  nan_threshold: 0.1  # 10% NaN threshold per column per window
  same_year_constraint: true

features:
  # Dynamic features (from your prep_data.py)
  dynamic_cols:
    - "SSM"
    - "SSM_avg"
    - "SWC_PI_F_2_1_1"
    - "SWC_PI_F_3_1_1"
    - "P_PI_F_1_1_1"
    - "P_PI_F_2_2_1"
    - "I"
    - "TA_1_1_1"
    - "RH_1_1_1"
  # Static features (Alpha Earth A00-A63)
  static_cols: "A00-A63"  # Shorthand, will expand to 64 features
  target_col: "RZSM_25_avg"
  add_temporal: false
  temporal_features:
    - "doy_sin"
    - "doy_cos"

model:
  # Standard LSTM (concatenates static + dynamic)
  model_type: "LSTM"
  hidden_dim: 32
  dropout: 0.4
  num_layers: 1

training:
  batch_size: 64
  epochs: 50
  learning_rate: 0.001
  weight_decay: 0.001
  early_stopping_patience: 10
  gradient_clip: 1.0
  scheduler_patience: 5
  scheduler_factor: 0.5

seed: 42
output_dir: "outputs"
log_level: "INFO"


